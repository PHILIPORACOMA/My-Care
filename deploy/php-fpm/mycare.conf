; My Care - PHP-FPM pool. Installed to /etc/php/8.4/fpm/pool.d/mycare.conf
; (docs/DEPLOYMENT.md). The socket path must match mycare-app.conf.

[mycare]
user = www-data
group = www-data

listen = /run/php/php8.4-fpm-mycare.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; A handful of RHU/LGU staff and a few hundred phones syncing now and then:
; a small, fixed pool is plenty and keeps memory predictable.
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; PHP-FPM empties the environment by default. The API shells out to Node for
; engine replay (ADR-0007), so it needs a PATH that finds `node`, and a temp
; directory. Without these, System Health reports engine replay as down and
; aggregates refuse to refresh - the same failure that `php artisan serve`
; causes on Windows (docs/STATUS.md).
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMPDIR] = /tmp

; Errors go to the log, never to a response.
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M
