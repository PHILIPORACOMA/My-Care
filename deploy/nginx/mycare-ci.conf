# My Care - the CI deploy-smoke site (.github/workflows/deploy-smoke.yml).
#
# Plain HTTP on localhost, where browsers do allow service workers, so the
# Playwright suite can run against the production layout without a
# certificate. Everything else comes from the same snippet production uses.
# Never use this on a public server.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost;

    include /etc/nginx/snippets/mycare-app.conf;
}
