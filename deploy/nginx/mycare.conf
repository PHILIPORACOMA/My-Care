# My Care - production site. Installed to /etc/nginx/sites-available/mycare
# and enabled by symlink (docs/DEPLOYMENT.md).
#
# Replace mycare.example.org with the real host name - in both server blocks.
# HTTPS is not optional: browsers only run service workers over HTTPS, so on
# plain HTTP the patient app has no offline mode at all.
#
# The certificate paths below are the ones certbot writes. Run certbot
# (DEPLOYMENT.md step 6) before enabling the HTTPS block, or nginx will refuse
# to start for want of the certificate files.

server {
    listen 80;
    listen [::]:80;
    server_name mycare.example.org;

    # certbot's HTTP-01 challenge, then everything else to HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mycare.example.org;

    ssl_certificate     /etc/letsencrypt/live/mycare.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mycare.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers, HSTS included, come from mycare-headers.conf inside
    # each location: an add_header here would be dropped by every location
    # that sets its own.

    include /etc/nginx/snippets/mycare-app.conf;
}
