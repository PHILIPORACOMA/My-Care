# My Care - the locations every server block shares.
#
# Included by mycare.conf (production, HTTPS) and mycare-ci.conf (the CI
# deploy-smoke job, plain HTTP on localhost), so the rules CI proves are the
# rules production runs. Installed to /etc/nginx/snippets/ by DEPLOYMENT.md.
#
# One host, split by path (Phase 9 decision, BUILD-LOG 9b):
#
#   /            patient app     apps/pwa/dist      (service worker, offline)
#   /portal/     sub-admin       apps/portal/dist
#   /console/    super-admin     apps/console/dist
#   /api/ /sanctum/ /up          Laravel via PHP-FPM
#
# One origin means the staff session cookie needs no cross-subdomain setup
# (ADR-0004) and one certificate covers everything.
#
# The app directory is fixed at /var/www/mycare. Change every occurrence
# together if you deploy elsewhere.

root /var/www/mycare/apps/pwa/dist;
index index.html;

# Sync batches and bundle imports are small JSON; nothing legitimate is large.
client_max_body_size 2m;

# No server version in error pages or headers.
server_tokens off;

# ---------------------------------------------------------------- the API
#
# Laravel's front controller is the only PHP that ever runs. Requests are
# passed straight to it rather than through try_files, so no other .php file
# under the web root can ever be executed.
location ~ ^/(api|sanctum)/ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/mycare/apps/api/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT /var/www/mycare/apps/api/public;
    fastcgi_pass unix:/run/php/php8.4-fpm-mycare.sock;
    # Engine replay on a large window can take a while (ADR-0007); the
    # scheduled job does the heavy lifting, but a report can trigger one too.
    fastcgi_read_timeout 120s;
}

# Laravel's health check, for uptime monitors.
location = /up {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/mycare/apps/api/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT /var/www/mycare/apps/api/public;
    fastcgi_pass unix:/run/php/php8.4-fpm-mycare.sock;
}

# ------------------------------------------------------------- staff apps
#
# Single-page apps: an unknown path under the prefix serves the app's
# index.html and the router takes over.
location ^~ /portal/ {
    alias /var/www/mycare/apps/portal/dist/;
    try_files $uri $uri/ /portal/index.html;
    include /etc/nginx/snippets/mycare-headers.conf;
}

location ^~ /console/ {
    alias /var/www/mycare/apps/console/dist/;
    try_files $uri $uri/ /console/index.html;
    include /etc/nginx/snippets/mycare-headers.conf;
}

location = /portal { return 301 /portal/; }
location = /console { return 301 /console/; }

# ------------------------------------------------------------ patient app
#
# The service worker and the page that registers it must never be cached by
# the browser's HTTP cache, or a phone can be stuck on an old app - and an old
# app means old triage code - long after an update. The service worker does
# its own precaching; this only stops the HTTP layer second-guessing it.
location = /sw.js {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/mycare-headers.conf;
}

location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/mycare-headers.conf;
}

location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/mycare-headers.conf;
}

# Vite puts a content hash in every asset file name, so these never change.
location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/mycare-headers.conf;
}

location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/snippets/mycare-headers.conf;
}

# Never serve dotfiles (.env lives outside the web roots, but be sure).
location ~ /\. {
    deny all;
}
