# Security headers, included in every location of mycare-app.conf.
#
# They live in a snippet because nginx drops a server's add_header lines in
# any location that sets its own, and several locations set Cache-Control.
#
# Permissions-Policy denies geolocation, camera and microphone outright: the
# patient app never uses them (no GPS - RA 10173; no microphone - BUILD-LOG),
# and the browser should refuse them even if a future change tried.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
# Use HTTPS for a year. Browsers ignore this header when it arrives over plain
# HTTP, so it is harmless on the CI site and binding on the production one.
add_header Strict-Transport-Security "max-age=31536000" always;
